<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;
    background-color: #aac4c7;
    background-size: cover;
    background-position: center;
    overflow-y: auto;

    margin-top: 20px;

.back {
    width: 100%;
    max-width: 550px;
    margin-bottom: 10px;
}
.back-home{
    text-decoration: none;
    color:rgb(139, 142, 141);
}
.back-icon{
    margin-bottom: 7px;
    margin-right: 5px;
    fill: rgb(139, 142, 141);
}
.back-home:hover{
    color:rgb(91, 94, 93);
}
.back-home:hover .back-icon {
    fill: rgb(91, 94, 93);
}

.box {
    width: 550px;
    background-color: rgb(22, 136, 140);
    border: 2px solid rgba(255, 255, 255, .2);
    box-shadow: 0 0 10px rgba(0, 0, 0, .2);
    border-radius: 10px;
    padding: 30px 40px;
    margin-top: 10px;
}
.box .img{
    text-align: center;
}
.box h1 {
    text-align: center;
}
.box .input-box {
    position: relative;
    width: 100%;
    margin: 20px 0;
}
.input-box input {
    width: 100%;
    height: 50px;
    background: transparent;
    border: none;
    outline: none;
    border: 2px solid rgba(255, 255, 255, .2);
    border-radius: 40px;
    font-size: 15px;
    color: #fff;
    padding: 20px 45px 20px 20px;
}
.input-box input::placeholder {
    color: #545151;
    font-size: 14px;
}
.input-box i {
    position: absolute;
    right: 20px;
    bottom: 14px;
    font-size: 20px;
}
.input-box label {
    display: block;
    margin-bottom: 4px;
    font-size: 17.5px;
    color: #fff;
}
.box .forgot {
    display: flex;
    justify-content: center;
    font-size: 14px;
    margin: 18px 0 15px;
}
.forgot a {
    text-decoration: none;
    color: #11056f;
}
.forgot a:hover {
    text-decoration: underline;
}
.box .btn-submit {
    width: 100%;
    height: 45px;
    background: #fff;
    border: none;
    outline: none;
    border-radius: 40px;
    box-shadow: 0 0 10px rgba(0, 0, 0, .1);
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    margin-top: 10px;
}

.role-toggle {
    display: flex;
    gap: 10px;
    margin: 20px 0 10px;
}
.role-btn {
    flex: 1;
    height: 42px;
    border-radius: 40px;
    border: 2px solid rgba(255, 255, 255, .5);
    background: transparent;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: all 0.25s ease;
}
.role-btn:hover {
    background: rgba(255, 255, 255, .15);
}
.role-btn.active {
    background: #fff;
    color: #333;
    border-color: #fff;
}
.role-btn.active i {
    color: #333;
}

.form-section {
    display: none;
}
.form-section.active {
    display: block;
}

.input-box select {
    width: 100%;
    height: 50px;
    background: transparent;
    border: 2px solid rgba(255, 255, 255, .2);
    border-radius: 40px;
    font-size: 15px;
    color: #fff;
    padding: 0 45px 0 20px;
    outline: none;
    appearance: none;
    cursor: pointer;
}

.input-box select option {
    background: #333;
    color: #fff;
}

.social-check-group {
    display: flex;
    gap: 20px;
    margin: 10px 0 15px;
}
.social-check-group label {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
}
.social-check-group input[type="checkbox"] {
    cursor: pointer;
    width: 18px;
    height: 18px;
}

.floating-tips-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    background-color: var(--navbar);
    color: white;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 9999;
    transition: all 0.3s ease;
    border: 2px solid white;
}

.floating-tips-btn:hover {
    transform: scale(1.1);
    background-color: #1da8ad;
    color: white;
}

.lamp-icon {
    font-size: 24px;
    line-height: 1;
}

.lamp-text {
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    margin-top: 2px;
}

@media (max-width: 500px) {
    .floating-tips-btn {
        bottom: 20px;
        right: 20px;
        width: 55px;
        height: 55px;
    }
}

.box .btn-submit {
    width: 100%;
    height: 45px;
    background: #ffffff;
    color: rgb(22, 136, 140);
    border: 2px solid transparent;
    outline: none;
    border-radius: 40px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    margin-top: 10px;
    transition: all 0.3s ease;
}

.box .btn-submit:hover {
    background: #f0f9f9;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
}

.box .btn-submit:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
}

body.dark-mode .box .btn-submit {
    background: #1da8ad; 
    color: #ffffff;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

body.dark-mode .box .btn-submit:hover {
    background: #16888c;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
}

body.dark-mode .box .btn-submit:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
}

.input-box textarea {
    width: 100%;
    min-height: 50px;
    height: 50px;
    background: transparent;
    border: none;
    outline: none;
    border: 2px solid rgba(255, 255, 255, .2);
    border-radius: 25px;
    font-size: 15px;
    color: #fff;
    padding: 13px 45px 13px 20px;
    resize: none;
    overflow-y: hidden;
    line-height: 1.5;
}

.input-box textarea::placeholder {
    color: #545151;
    font-size: 14px;
}

body.dark-mode .input-box textarea {
    color: #ffffff !important;
    border-color: rgba(255, 255, 255, 0.2) !important;
}

body.dark-mode .input-box textarea::placeholder {
    color: #aaaaaa !important;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="back">

        <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">

    </a>

<div class="box">
    <div class="img">
        <img src="images/logo2-removebg-preview.png" width="230px" alt="logo">
    </div>

    <form action="" method="get" id="form-log">
        <input type="hidden" id="role" value="CUSTOMER">

        <div class="role-toggle">
            <button type="button" class="role-btn active" id="btn-customer" onclick="switchRole('customer')">
                <i class='bx bx-user'></i> Customer
            </button>
            <button type="button" class="role-btn" id="btn-owner" onclick="switchRole('owner')">
                <i class='bx bx-store'></i> Service Provider
            </button>
        </div>

        <div class="form-section active" id="section-customer">
            <div class="input-box">
                <label>Name</label>
                <input type="text" id="customerName" placeholder="e.g. Rana">
                <i class='bx bx-user' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Email</label>
                <input type="email" id="customerEmail" placeholder="example@gmail.com">
                <i class='bx bx-envelope' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Phone Number</label>
                <input type="tel" id="customerPhone" placeholder="07××××××××" pattern="[0-9]{10}" maxlength="10" title="Please enter a 10-digit phone number only." oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <i class='bx bx-phone' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Password</label>
                <input type="password" id="customerPassword" placeholder="........">
                <i class='bx bx-lock' style="color:#fff;"></i>
            </div>
        </div>

        <div class="form-section" id="section-owner">
            <div class="input-box">
                <label>Store Name</label>
                <input type="text" id="storeName" placeholder="e.g. My Shop">
                <i class='bx bx-store' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Owner Name</label>
                <input type="text" id="ownerName" placeholder="e.g. Ahmad">
                <i class='bx bx-user' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Email</label>
                <input type="email" id="ownerEmail" placeholder="store@gmail.com">
                <i class='bx bx-envelope' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Password</label>
                <input type="password" id="ownerPassword" placeholder="........">
                <i class='bx bx-lock' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Phone Number</label>
                <input type="tel" id="ownerPhone" placeholder="07××××××××" pattern="[0-9]{10}" maxlength="10" title="Please enter a 10-digit phone number only." oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <i class='bx bx-phone' style="color:#fff;"></i>
            </div>
            
            <div class="input-box">
                <label>City</label>
                <input type="text" id="ownerCity" placeholder="e.g. Amman">
                <i class='bx bx-map' style="color:#fff;"></i>
            </div>

            <div class="input-box">
                <label>Store Specialty</label>
                <select id="storeSpecialty" required>
                    <option value="" disabled selected>Select specialty</option>
                    <option value="furniture">Furniture Stores</option>
                    <option value="carpenters">Carpenters</option>
                    <option value="blacksmiths">Blacksmiths</option>
                    <option value="moving">Moving Companies</option>
                    <option value="helpers">Home Helpers</option>
                    <option value="services">Home Services</option>
                </select>
                <i class='bx bx-category' style="color:#fff;"></i>
            </div>
            <div class="input-box">
                <label>Store Description</label>
                <textarea id="storeDescription" placeholder="Describe your store..." rows="1" oninput="this.style.height = '50px'; this.style.height = this.scrollHeight + 'px'"></textarea>
                <i class='bx bx-notepad' style="color:#fff;"></i>
            </div>

            <div style="margin: 20px 0;">
                <label style="color: #fff; font-size: 17.5px; margin-bottom: 5px; display: block;">Social Media Pages (Optional)</label>
                <div class="social-check-group">
                    <label>
                        <input type="checkbox" id="checkInsta" onclick="toggleSocialInput('Insta')"> 
                        <i class='bx bxl-instagram' style="font-size: 18px;"></i> Instagram
                    </label>
                    <label>
                        <input type="checkbox" id="checkFB" onclick="toggleSocialInput('FB')"> 
                        <i class='bx bxl-facebook-circle' style="font-size: 18px;"></i> Facebook
                    </label>
                </div>

                <div class="input-box" id="instaContainer" style="display: none; margin-top: 10px;">
                    <label>Instagram Page Name</label>
                    <input type="text" id="instaPage" placeholder="Enter Instagram username...">
                    <i class='bx bxl-instagram' style="color: #fff;"></i>
                </div>

                <div class="input-box" id="fbContainer" style="display: none; margin-top: 10px;">
                    <label>Facebook Page Name</label>
                    <input type="text" id="fbPage" placeholder="Enter Facebook page name...">
                    <i class='bx bxl-facebook-circle' style="color:#fff;"></i>
                </div>
            </div>

        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Create an account</button>

        <div class="forgot">
            <p>Already have an account?
                <a href="login2.html" style="padding: 0 5px;">Login</a>
            </p>
        </div>
    </form>
</div>

<script>
function switchRole(role) {
    document.getElementById('btn-customer').classList.toggle('active', role === 'customer');
    document.getElementById('btn-owner').classList.toggle('active', role === 'owner');

    document.getElementById('section-customer').classList.toggle('active', role === 'customer');
    document.getElementById('section-owner').classList.toggle('active', role === 'owner');

    document.getElementById('role').value = role === 'customer' ? 'CUSTOMER' : 'PROVIDER';

    const isCustomer = role === 'customer';
    const isOwner = role === 'owner';

    document.getElementById('customerName').required = isCustomer;
    document.getElementById('customerEmail').required = isCustomer;
    document.getElementById('customerPhone').required = isCustomer;
    document.getElementById('customerPassword').required = isCustomer;

    document.getElementById('storeName').required = isOwner;
    document.getElementById('ownerName').required = isOwner;
    document.getElementById('ownerEmail').required = isOwner;
    document.getElementById('ownerPhone').required = isOwner;
    document.getElementById('ownerCity').required = isOwner;
    document.getElementById('storeSpecialty').required = isOwner;
    document.getElementById('ownerPassword').required = isOwner;
}

function toggleSocialInput(platform) {
    const checkbox = document.getElementById(`check${platform}`);
    const container = document.getElementById(`${platform.toLowerCase()}Container`);
    const input = document.getElementById(`${platform.toLowerCase()}Page`);

    if (checkbox.checked) {
        container.style.display = 'block';
        input.required = true;
    } else {
        container.style.display = 'none';
        input.required = false;
        input.value = '';
    }
}

switchRole('customer');

document.getElementById('form-log').addEventListener('submit', function(e) {
    const role = document.getElementById('role').value;
    
    if (role === 'PROVIDER') {
        const storeName = document.getElementById('storeName').value.trim();
        const ownerName = document.getElementById('ownerName').value.trim(); 
        const ownerPhone = document.getElementById('ownerPhone').value.trim();
        const ownerCity = document.getElementById('ownerCity').value.trim();
        const storeDescription = document.getElementById('storeDescription').value.trim(); 
        const ownerEmail = document.getElementById('ownerEmail').value.trim();
        
        const instaPage = document.getElementById('instaPage').value.trim();
        const fbPage = document.getElementById('fbPage').value.trim();

        const categorySelect = document.getElementById('storeSpecialty');
        const categoryText = categorySelect.options[categorySelect.selectedIndex].text;
        const categoryValue = categorySelect.value; 

        localStorage.setItem('activeStoreCategory', categoryText);
        if (categoryValue) localStorage.setItem('activeStoreSpecialty', categoryValue); 
        localStorage.setItem('activeStoreInsta', instaPage);
        localStorage.setItem('activeStoreFB', fbPage);

        if(ownerEmail) {
            const docId = ownerEmail.toLowerCase().replace(/[^a-z0-9]/g, "_");
            
            const newStoreData = {
                storeName: storeName,
                name: ownerName,
                ownerName: ownerName,
                email: ownerEmail,
                ownerEmail: ownerEmail,
                phone: ownerPhone,
                ownerPhone: ownerPhone,
                city: ownerCity,
                ownerCity: ownerCity,
                address: ownerCity,
                category: categoryText,
                storeCategory: categoryText,
                storeSpecialty: categoryValue,
                description: storeDescription,
                storeDescription: storeDescription,
                instaPage: instaPage || "",
                fbPage: fbPage || "",
                role: "PROVIDER",
                approved: false
            };

            db.collection("stores").doc(docId).set(newStoreData, { merge: true });
            db.collection("users").doc(docId).set(newStoreData, { merge: true });
        }
    }
});
</script>
