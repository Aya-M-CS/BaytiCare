<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
}
body{
    min-height: 100vh;
    display: flex;
    justify-content: flex-start;
    align-items: center;
    flex-direction: column;
    background-color: #aac4c7;
    background-size: cover;
    background-position: center;
    overflow: hidden;
    margin-top: 50px;
}

.back {
    width: 100%;
    max-width: 550px;
    margin-bottom: 10px;
}
.back-home{
    text-decoration: none;
    color:rgb(139, 142, 141);
    
}
.back-icon{
    margin-bottom: 7px; margin-right: 5px;
    fill: rgb(139, 142, 141);
}
.back-home:hover{
    color:rgb(91, 94, 93);
}
.back-home:hover .back-icon {
  fill: rgb(91, 94, 93);
}

.box{
    width: 550px;
    background-color: rgb(22, 136, 140);
    border: 2px solid rgba(255, 255, 255, .2);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 10px rgba(0, 0, 0, .2);
    border-radius: 10px;
    padding: 30px 40px;
}
.box .img{
    text-align: center;
}
.box h1{
    text-align: center;
}
.box .input-box{
    position: relative;
    width: 100%;
    height: 50px;
    margin: 30px 0;
}
.input-box input{
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    border: 2px solid rgba(255, 255, 255, .2);
    border-radius: 40px;
    font-size: 16px;
    color: #fff;
    padding: 20px 45px 20px 20px;
}
.input-box input::placeholder{
    color: #545151;
    font-size: 14px;
}
.input-box i{
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
}
.box .forgot{
    display: flex;
    justify-content: center;
    font-size: 14px;
    margin: 18px 0 15px;
}
.forgot a{
    text-decoration: none;
    color: #11056f;
}
.forgot a:hover{
    text-decoration: underline;
}

.box .btn {
    width: 100%;
    height: 45px;
    background: #ffffff !important;
    color: rgb(22, 136, 140) !important;
    border: 2px solid transparent !important;
    outline: none !important;
    border-radius: 40px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15) !important;
    cursor: pointer;
    font-size: 16px;
    font-weight: 700;
    margin-top: 10px;
    transition: all 0.3s ease;
}

.box .btn:hover, 
.box .btn:focus {
    background: #f0f9f9 !important;
    color: rgb(22, 136, 140) !important;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2) !important;
}

.box .btn:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15) !important;
}

body.dark-mode .box .btn {
    background: #1da8ad !important; 
    color: #ffffff !important;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3) !important;
}

body.dark-mode .box .btn:hover,
body.dark-mode .box .btn:focus {
    background: #16888c !important;
    color: #ffffff !important;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4) !important;
}

body.dark-mode .box .btn:active {
    transform: translateY(1px) scale(0.97);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3) !important;
}
/* ///////////////////////////////////// */
.floating-tips-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    background-color: var(--navbar);
    color: white;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    z-index: 9999;
    transition: all 0.3s ease;
    border: 2px solid white;
}

.floating-tips-btn:hover {
    transform: scale(1.1);
    background-color: #1da8ad;
    color: white;
}

.lamp-icon {
    font-size: 24px;
    line-height: 1;
}

.lamp-text {
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    margin-top: 2px;
}

@media (max-width: 500px) {
    .floating-tips-btn {
        bottom: 20px;
        right: 20px;
        width: 55px;
        height: 55px;
    }
}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="back">
<a href="index.html" class="back-home">
<svg class="back-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"  
 viewBox="0 0 24 24">
<path d="M3 13h1v7c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-7h1c.4 0 .77-.24.92-.62.15-.37.07-.8-.22-1.09l-8.99-9a.996.996 0 0 0-1.41 0l-9.01 9c-.29.29-.37.72-.22 1.09s.52.62.92.62Zm7 7v-5h4v5zm2-15.59 6 6V20h-2v-5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v5H6v-9.59z"></path>
</svg>Back to home</a>
</div>

<div class="box">
    <div class="img">
        <img src="images/logo2-removebg-preview.png"  width="230px"  alt="Logo">
    </div>
<form action="" method="get" id="form-log">
<div class="input-box">

<input type="email" id="loginEmail" required placeholder="Enter your email">
<i class="bx bx-envelope" style="color:#000000;" ></i>
</div>
<div class="input-box">
<input type="password" id="loginPassword" required placeholder="Enter your password" >


<i class="bx bx-lock" style="color:#000000;" ></i>
</div>
<button type="submit" class="btn">Login</button>
<div class="forgot">
<p class="forgot">Don't have an account?
<a href="signup2.html" style="padding: 0 5px;">Sign up</a></p>
</div>
</form>
</div>

<script src="script.js"></script>
<script src="dark-mode.js"></script>
<a href="tips.html" class="floating-tips-btn" title="Home Care Tips">
    <span class="lamp-icon">💡</span>
    <span class="lamp-text">Tips</span>
</a>
</body>
</html>
